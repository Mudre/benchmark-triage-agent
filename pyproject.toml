[project]
name = "triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mudre", email = "moderahmad@outlook.de" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]

[project.scripts]
triage = "triage:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
